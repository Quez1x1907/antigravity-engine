name: Antigravity agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Задача для агента'
        required: true
        type: string
      initData:
        description: 'Telegram initData владельца (проверяется ниже)'
        required: true
        type: string

# один запуск за раз — агент тяжёлый
concurrency:
  group: antigravity-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: [self-hosted, antigravity]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Telegram initData (owner only)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_TG_ID: '5485249627'
          INIT_DATA: ${{ inputs.initData }}
        run: node scripts/validate-init-data.js "$BOT_TOKEN" "$OWNER_TG_ID" "$INIT_DATA"

      - name: Run Antigravity agent
        env:
          TASK: ${{ inputs.task }}
        run: bash scripts/run-agent.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-result-${{ github.run_id }}
          path: |
            output/**
            !output/**/*.tmp
          if-no-files-found: warn
          retention-days: 30
